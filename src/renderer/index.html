<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VanaTok</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">V</div>
          <div>
            <h1>VanaTok</h1>
            <small>Creator Studio</small>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">Live Camera</button>
          <button class="nav-item">Effects</button>
          <button class="nav-item">Overlays</button>
          <button class="nav-item">Presets</button>
          <button class="nav-item">Publish</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Desktop Creator Suite</p>
            <h2>Live Preview</h2>
          </div>
          <div class="actions">
            <button class="secondary" id="savePresetBtn">Save Preset</button>
            <button class="primary" id="startCameraBtn">Start Camera</button>
          </div>
        </header>

        <section class="studio-grid">
          <div class="preview-panel">
            <div class="preview-frame">
              <video id="previewVideo" autoplay playsinline muted></video>
              <div class="preview-overlay">
                <span>Camera preview</span>
              </div>
            </div>
            <div class="control-row">
              <button class="ghost" data-facing="user">Front</button>
              <button class="ghost" data-facing="environment">Back</button>
              <button class="ghost" id="screenSourceBtn">Screen</button>
              <button class="primary" id="recordBtn">Record</button>
            </div>
          </div>

          <aside class="panel tools-panel">
            <div class="panel-section">
              <h3>Effects</h3>
              <div class="chip-list">
                <span>Beauty</span>
                <span>Blur</span>
                <span>Glow</span>
                <span>Vignette</span>
              </div>
            </div>

            <div class="panel-section">
              <h3>Overlays</h3>
              <div class="item-list">
                <div>Brand logo</div>
                <div>Lower third</div>
                <div>Countdown</div>
                <div>Donation ticker</div>
              </div>
            </div>

            <div class="panel-section">
              <h3>Publish</h3>
              <div class="item-list">
                <div>TikTok draft</div>
                <div>Live stream</div>
                <div>Export MP4</div>
              </div>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
